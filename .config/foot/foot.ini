[main]
font=DejaVu Sans Mono:size=12,Symbols Nerd Font Mono:size=12
font-bold=DejaVu Sans Mono:style=Bold:size=12
pad=6x6
# colours come from the active rice (rice set NAME); see ~/.config/rices
include=~/.config/rices/current/foot.ini
[key-bindings]
clipboard-copy=Control+Shift+c Control+Shift+x XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
prompt-next=Control+Shift+j

[search-bindings]
find-prev=Control+r Up
find-next=Control+s Down
extend-to-word-boundary=Control+w
extend-line-down=Shift+Down
