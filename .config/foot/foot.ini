[main]
font=JetBrains Mono:size=12
pad=6x6
[colors-dark]
background=000000
foreground=c0ffc0
selection-background=1f6f2f
selection-foreground=c0ffc0
regular0=000000
regular1=4f7f5a
regular2=00ff41
regular3=c0ffc0
regular4=1f6f2f
regular5=4f7f5a
regular6=00ff41
regular7=c0ffc0
bright0=4f7f5a
bright1=00ff41
bright2=00ff41
bright3=c0ffc0
bright4=1f6f2f
bright5=c0ffc0
bright6=00ff41
bright7=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c Control+Shift+x XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
prompt-next=Control+Shift+j

[search-bindings]
find-prev=Control+r Up
find-next=Control+s Down
extend-to-word-boundary=Control+w
extend-line-down=Shift+Down
