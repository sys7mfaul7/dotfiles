# Omarchy-style tmux
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g mouse on
set -g set-clipboard on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -as terminal-features ",foot*:RGB,xterm*:RGB"   # truecolor (tmux 3.2+); Tc above is for older tmux
set -g focus-events on   # nvim :checkhealth (autoread)
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
if-shell '[ -n "$WAYLAND_DISPLAY" ]' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
set -g status-style "bg=#000000,fg=#c0ffc0"
set -g status-left "#[fg=#000000,bg=#00ff41,bold] #S #[default] "
set -g status-right "#[fg=#00ff41]%H:%M "
setw -g window-status-current-style "fg=#000000,bg=#00ff41,bold"
setw -g window-status-style "fg=#c0ffc0"
set -g pane-border-style "fg=#1f6f2f"
set -g pane-active-border-style "fg=#00ff41"
set -g message-style "bg=#000000,fg=#00ff41"
set -g mode-style "bg=#1f6f2f,fg=#c0ffc0"

# vi copy-mode extras
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind / copy-mode \; command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# smart-splits.nvim (backend-tmux, by hand; at_edge = stop) -- winnav
# Alt+h/j/k/l: move between nvim windows and tmux panes; Alt+Shift+H/J/K/L: resize
bind -n M-h if -F "#{@pane-is-vim}" { send-keys M-h } { if -F "#{pane_at_left}"   "" "select-pane -L" }
bind -n M-j if -F "#{@pane-is-vim}" { send-keys M-j } { if -F "#{pane_at_bottom}" "" "select-pane -D" }
bind -n M-k if -F "#{@pane-is-vim}" { send-keys M-k } { if -F "#{pane_at_top}"    "" "select-pane -U" }
bind -n M-l if -F "#{@pane-is-vim}" { send-keys M-l } { if -F "#{pane_at_right}"  "" "select-pane -R" }
bind -n M-H if -F "#{@pane-is-vim}" { send-keys M-H } { resize-pane -L 3 }
bind -n M-J if -F "#{@pane-is-vim}" { send-keys M-J } { resize-pane -D 3 }
bind -n M-K if -F "#{@pane-is-vim}" { send-keys M-K } { resize-pane -U 3 }
bind -n M-L if -F "#{@pane-is-vim}" { send-keys M-L } { resize-pane -R 3 }
bind -T copy-mode-vi M-h if -F "#{pane_at_left}"   "" "select-pane -L"
bind -T copy-mode-vi M-j if -F "#{pane_at_bottom}" "" "select-pane -D"
bind -T copy-mode-vi M-k if -F "#{pane_at_top}"    "" "select-pane -U"
bind -T copy-mode-vi M-l if -F "#{pane_at_right}"  "" "select-pane -R"
