<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- DejaVu Sans Mono everywhere; Nerd symbols then colour emoji as fallbacks -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Symbols Nerd Font Mono</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
    <default><family>DejaVu Sans Mono</family></default>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans Mono</family><family>Symbols Nerd Font Mono</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
    <default><family>DejaVu Sans Mono</family></default>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>DejaVu Sans Mono</family><family>Symbols Nerd Font Mono</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
    <default><family>DejaVu Sans Mono</family></default>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>DejaVu Sans Mono</family><family>Symbols Nerd Font Mono</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
    <default><family>DejaVu Sans Mono</family></default>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Symbols Nerd Font Mono</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
    <default><family>DejaVu Sans Mono</family></default>
  </alias>
</fontconfig>
