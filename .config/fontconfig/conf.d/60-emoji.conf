<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias><family>sans-serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>monospace</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
