<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Emoji stays a fallback only; never let it supply digits, spaces or Latin text -->
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0x0000</int><int>0x00FF</int></range><range><int>0x2000</int><int>0x200B</int></range><range><int>0x2010</int><int>0x205F</int></range></charset></minus>
    </edit>
  </match>
  <!-- Monochrome fonts give up emoji so the color emoji font wins fallback -->
  <match target="scan">
    <test name="family" compare="contains"><string>DejaVu</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0x1F300</int><int>0x1FAFF</int></range><range><int>0x2600</int><int>0x27BF</int></range></charset></minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains"><string>FreeSerif</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0x2600</int><int>0x27BF</int></range></charset></minus>
    </edit>
  </match>
  <!-- Every other font gives up the main emoji blocks -->
  <match target="scan">
    <test qual="all" name="family" compare="not_eq"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0x1F300</int><int>0x1FAFF</int></range></charset></minus>
    </edit>
  </match>
  <!-- Emoji-style symbols (hearts, check marks, stars) go to color emoji; terminal/bar fonts keep theirs -->
  <match target="scan">
    <test qual="all" name="family" compare="not_eq"><string>Noto Color Emoji</string></test>
    <test qual="all" name="family" compare="not_contains"><string>JetBrains</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0x2600</int><int>0x27BF</int></range><range><int>0x2B50</int><int>0x2B55</int></range><range><int>0x231A</int><int>0x231B</int></range><range><int>0x23E9</int><int>0x23FA</int></range></charset></minus>
    </edit>
  </match>
  <selectfont><rejectfont><pattern><patelt name="family"><string>Symbola</string></patelt></pattern></rejectfont></selectfont>
</fontconfig>
