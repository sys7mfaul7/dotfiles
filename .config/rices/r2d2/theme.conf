# R2-D2: a variant of Azure Glow (same navy-black structure) using the fan-made
# R2D2 palette from color-hex.com palette 71451 (not official): blue 0849d6,
# silver c1c3c9, white f7f9fd, dark grey 3f4655, red c31212 (the eye).
# 0849d6 is dark on near-black (2.9:1), so the accent is the brighter 4a8cff (6.3:1)
# and 0849d6 stays for fills; text-level blues (mid/light/icon) are brighter
# tints of the same hue (221), and the selection is a darker shade so selected text stays readable.
# method = azure: greens -> R2 blues/greys, near-black -> navy; other syntax colours kept.
name = R2-D2
method = azure
hue = 221
cmatrix = blue
brave_tint = 0.59
name16 = blue
htop_scheme = 0
# rule-derived text colours are lifted to at least this contrast on the background
min_contrast = 4.6

[map]
# popborder: menu/popover/tooltip border (>=3:1 on bg)
3d6b46 = 5a6478
000000 = 010409
0a0e14 = 0d1117
0c1018 = 151b23
c0ffc0 = c1c3c9
e0ffe0 = f7f9fd
00ff41 = 4a8cff
1f6f2f = 0f2454
4f7f5a = 848ea4
5fbf5f = 6f95ea
8fef8f = a3bdf3
2f5a2f = 4b5366
0f1f14 = 1a2030
1a2a1f = 3f4655
578a29 = 5285ee
ff5f5f = e85454
ff3b3b = e03131
# nvim tokens (1 step off green's base colours): readable line numbers/comments,
# a grey statusline distinct from CursorLine, and a dimmer inactive one
2f5a31 = 717b93
00ff42 = f5f7fc
0f1a15 = 3e4757
2f5a30 = a0a6b4
0f1a16 = 1e2433
# markdown H5/H6 heading text on its heading background
4f9f4f = 7b93c6
3f7f3f = 7088c0

[ansi]
background           = 010409
foreground           = c1c3c9
selection-background = 0f2454
selection-foreground = f7f9fd
regular0 = 484f58
regular1 = c31212
regular2 = 3fb950
regular3 = d29922
regular4 = 3b6fe0
regular5 = bc8cff
regular6 = 39c5cf
regular7 = c1c3c9
bright0  = 6e7681
bright1  = e85454
bright2  = 56d364
bright3  = e3b341
bright4  = 6f95ea
bright5  = d2a8ff
bright6  = 56d4dd
bright7  = f7f9fd

# [ui]: menu/bar selection = light blue with black text (sampled from Slack's
# "Unreads" highlight); prompt parts in readable R2 tints.
[ui]
select_bg      = 00aaff
select_fg      = 000000
menu_title     = 00aaff
prompt_bracket = 848ea4
prompt_user    = 00aaff
prompt_at      = 848ea4
prompt_host    = 00aaff
prompt_path    = f7f9fd
prompt_symbol  = 00aaff
prompt_error   = e03131
prompt_meta    = 848ea4
