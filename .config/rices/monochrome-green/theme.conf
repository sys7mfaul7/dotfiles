# Monochrome Green (was "h4ck3r"): green phosphor CRT. THE MASTER THEME.
# Colours here are written without '#'. [roles] names the main colours (they
# become C_* in palette.sh); [ansi] is the 16-colour terminal set (foot).
# Other themes map every colour in the managed files from this one.
name = Monochrome Green
method = identity
cmatrix =
brave_tint = 0.37
name16 = green
htop_scheme = 0
remmina_grab = 00ff00
foot_alpha = 0.9

[roles]
bg      = 000000
bg_alt  = 0a0e14
fg      = c0ffc0
accent  = 00ff41
sel     = 1f6f2f
dim     = 4f7f5a
urgent  = ff5f5f
border  = 1a2a1f
mid     = 5fbf5f
dark    = 2f5a2f
light   = 8fef8f
hover   = 0f1f14
icon    = 578a29

[ansi]
background           = 000000
foreground           = c0ffc0
selection-background = 1f6f2f
selection-foreground = c0ffc0
regular0 = 000000
regular1 = 4f7f5a
regular2 = 00ff41
regular3 = c0ffc0
regular4 = 1f6f2f
regular5 = 4f7f5a
regular6 = 00ff41
regular7 = c0ffc0
bright0  = 4f7f5a
bright1  = 00ff41
bright2  = 00ff41
bright3  = c0ffc0
bright4  = 1f6f2f
bright5  = c0ffc0
bright6  = 00ff41
bright7  = ffffff

# [ui]: role colours that are not a plain recolour of one green token. Other
# themes get these through their map unless their own [ui] sets a key.
# select_*: bemenu --hb/--hf, rofi/jgmenu selection; a theme that sets select_bg
# itself also gets it on waybar's focused workspace / active task.
# prompt_*: bash prompt parts (empty = terminal default colour).
[ui]
select_bg      = 1f6f2f
select_fg      = c0ffc0
border_focused = c0ffc0
menu_title     = 00ff41
prompt_bracket = e6db74
prompt_user    = 00ff41
prompt_at      = ffffff
prompt_host    = 00ff41
prompt_path    = 00ff41
prompt_symbol  =
prompt_error   =
prompt_meta    = 2f5a2f
