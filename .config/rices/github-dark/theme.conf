# GitHub Dark (was the first "Azure Glow"): dark navy GitHub-style palette sampled from the user's screenshot
# (bg 0d1117 in the screenshot; main bg deepened to 010409 on request, text f0f6fc/e6edf3, links 4493f8, code bg 1e232a, rules 2e353c,
# borders 3d444d, muted 9198a1), close to Neovim's lunaperche / Hyprland azureglow.
# method = azure: greens -> blues/greys, near-black -> navy; yellow/purple/cyan/red
# syntax colours are kept, so editors stay multi-colour like lunaperche.
name = GitHub Dark
method = azure
# rule-derived text colours are lifted to at least this contrast on the background
min_contrast = 4.6
hue = 213
cmatrix = blue
brave_tint = 0.59
name16 = blue
htop_scheme = 0

[map]
# popborder: menu/popover/tooltip border (>=3:1 on bg)
