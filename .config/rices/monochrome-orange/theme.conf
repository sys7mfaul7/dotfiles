# Monochrome Orange: IBM 5151-style amber phosphor on black.
# method = hue: every coloured (non-red) green-theme colour keeps its
# lightness/saturation but takes hue 41 (amber). Reds stay red; [map] pins
# exact colours; keep = colours left untouched (yellow pinned-window borders).
name = Monochrome Orange
method = hue
# rule-derived text colours are lifted to at least this contrast on the background
min_contrast = 4.6
hue = 41
keep = ffe600 7a6e00
cmatrix = yellow
brave_tint = 0.11
name16 = yellow
htop_scheme = 0

[map]
# popborder: menu/popover/tooltip border (>=3:1 on bg)
3d6b46 = 6e5c36
00ff41 = ffb000
c0ffc0 = ffe0b0
