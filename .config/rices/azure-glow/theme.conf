# Azure Glow: the Omarchy theme by Hydradevx
# (https://github.com/Hydradevx/omarchy-azure-glow-theme, commit 7299269, 2025-08-12):
# "deep, cyber-ocean": midnight 0a0e14/0a0f14 bases, ice-blue text a9dfff/b3e5fc,
# neon azure 00bfff, electric cyan 00e0ff, steel 1b2a3a, stormy teal 355a66.
# Sources: README palette + terminal colours, waybar.css, mako.ini (-> dunst),
# neovim.lua, hyprland.conf borders (00ccff focused, 00334d normal), btop.theme
# (used verbatim, see [files]). Its icons.theme (Yaru-blue) is not installed.
# The previous screenshot-based "Azure Glow" is now github-dark.
name = Azure Glow
method = azure
hue = 195
cmatrix = cyan
brave_tint = 0.54
name16 = cyan
htop_scheme = 0

[map]
000001 = 06090d
# popborder: menu/popover/tooltip border (>=3:1 on bg)
3d6b46 = 3d6e80
000000 = 0a0e14   # bg (waybar/mako/nvim)
0a0e14 = 101820   # secondary bg (README)
0c1018 = 0e1620   # panels (nvim Pmenu/StatusLine)
c0ffc0 = a9dfff   # fg (README)
e0ffe0 = e6f0ff   # bright text (nvim fg / waybar light)
00ff41 = 00bfff   # primary: neon azure
1f6f2f = 123c56   # selection (nvim Visual)
4f7f5a = 355a66   # dim/muted (nvim muted)
5fbf5f = 40c4ff   # mid (waybar primary)
8fef8f = b3e5fc   # light (waybar fg / nvim light)
2f5a2f = 1b2a3a   # dark (waybar muted)
0f1f14 = 0f141c   # hover (nvim CursorLine)
1a2a1f = 00334d   # border (hyprland inactive)
578a29 = 00e0ff   # icons: electric cyan
ff5f5f = ff4c4c   # urgent/error
ff3b3b = ff5252   # danger (waybar)
e6db74 = ffd43b   # amber -> warning

[ansi]
background           = 0a0f14
foreground           = a9dfff
selection-background = 123c56
selection-foreground = e6f0ff
regular0 = 101820
regular1 = ff4c4c
regular2 = 2affd5
regular3 = ffd43b
regular4 = 00bfff
regular5 = 9a6bff
regular6 = 00e0ff
regular7 = a9dfff
bright0  = 1c2833
bright1  = ff6b6b
bright2  = 4dffd9
bright3  = ffdf70
bright4  = 4dcfff
bright5  = b594ff
bright6  = 4deeff
bright7  = ffffff

# upstream btop theme as is (rice re-renders the green file when leaving)
[files]
~/.config/btop/themes/h4ck3r.theme = btop.theme

[ui]
select_bg      = 00bfff
select_fg      = 000000
border_focused = 00ccff
prompt_bracket = 355a66
prompt_user    = 00e0ff
prompt_at      = 355a66
prompt_host    = 00bfff
prompt_path    = a9dfff
prompt_symbol  = 00bfff
prompt_error   = ff4c4c
prompt_meta    = 355a66
