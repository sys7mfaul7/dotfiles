# Monochrome Blue: neon / electric blue on black (same structure as green).
name = Monochrome Blue
method = hue
# rule-derived text colours are lifted to at least this contrast on the background
min_contrast = 4.6
hue = 199
cmatrix = cyan
brave_tint = 0.55
name16 = cyan
htop_scheme = 0

[map]
# popborder: menu/popover/tooltip border (>=3:1 on bg)
3d6b46 = 3d6578
00ff41 = 00b4ff
c0ffc0 = c0ecff
