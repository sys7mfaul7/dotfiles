# ~/.config/bspwm/picom.conf : compositor for the X11 bspwm session
# part of sys7mfaul7 dotfiles
# Kept simple on purpose: no shadows, no blur, no rounded corners, short fades.
# Per-window transparency is set with picom-trans (Ctrl+Alt+plus/minus/t).
backend = "glx";
vsync = true;
use-damage = false;          # avoids flicker on this GPU
unredir-if-possible = false;
log-level = "error";

shadow = false;
corner-radius = 0;
frame-opacity = 1.0;
detect-client-opacity = true;
detect-transient = true;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

rules = (
    # terminals stay solid unless picom-trans set something
    { match = "(class_g = 'XTerm' || class_g = 'FloaTerm' || class_g = 'foot') && !_NET_WM_WINDOW_OPACITY@"; opacity = 1.0; },
    # no fades on menus, bar, notifications, popups, video
    { match = "class_g = 'Rofi' || class_g = 'Polybar' || class_g = 'Dunst' || class_g = 'jgmenu' || window_type = 'dock'"; fade = false; },
    { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip'"; fade = false; },
    { match = "class_g = 'mpv' || fullscreen"; fade = false; }
);
