; ~/.config/bspwm/polybar/config.ini : top bar for the X11 session
; part of sys7mfaul7 dotfiles
;
; Interface, battery and the right-hand module list are filled in by
; scripts/bar at launch. Click actions use scripts in ~/.config/bspwm/scripts.

; colours, fonts and the bar height are written by scripts/theme-apply from
; ~/.config/bspwm/theme into this file (section [theme]):
include-file = ~/.config/bspwm/generated/polybar.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
bottom = false
fixed-center = true
width = 100%
; height is in points, converted with the session DPI (scripts/dpi)
height = ${theme.height}
dpi = ${env:XFT_DPI:96}
background = ${theme.bg}
foreground = ${theme.fg}
border-top-size = 0
border-bottom-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
line-size = 2

; T1 text (the one font setting), T2 icons, T3 large icons, T4 emphasis
font-0 = ${theme.font-text}
font-1 = ${theme.font-icon}
font-2 = ${theme.font-icon-big}
font-3 = ${theme.font-emph}

modules-left = menu dots workspaces
modules-center = title
; filled in by scripts/bar (battery only when there is one, tray on one bar)
modules-right = ${env:BAR_MODULES_RIGHT:network cpu memory volume date power}

wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

[settings]
screenchange-reload = false
pseudo-transparency = false

; ---------------------------------------------------------------- left
[module/menu]
type = custom/text
format = λ
format-font = 4
format-foreground = ${theme.accent}
click-left = launcher

[module/dots]
; divider; click opens the window switcher (rofi window list, dmenu theme)
type = custom/text
format = 󰇙
format-font = 2
format-foreground = #578a29
click-left = rofi -show window -theme ~/.config/bspwm/rofi/dmenu.rasi &

[module/workspaces]
; desktops 1-10 with occupied/previous/focused shading (~/.local/bin/polybar-ws)
type = custom/script
exec = ~/.local/bin/polybar-ws
tail = true

; ---------------------------------------------------------------- centre
[module/title]
type = custom/script
exec = ~/.local/bin/polybar-wintitle
tail = true
format-foreground = ${theme.fg}

; ---------------------------------------------------------------- right
[module/network]
; icon only (Wi-Fi strength / ethernet / offline) from ~/.local/bin/waybar-net;
; polybar has no tooltips: run "waybar-net --text" for the IP / DNS / link details
type = custom/script
exec = ~/.local/bin/waybar-net --polybar
interval = 5
click-left = bartui network
click-right = bartui network-gui

[module/vpn]
; shows only while a tun0 VPN is up
type = internal/network
interface = tun0
interval = 5
format-connected = <label-connected>
format-connected-prefix = "󰖂 "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${theme.accent}
label-connected = %local_ip%
format-disconnected =

[module/target]
; pentest target note: `target 10.10.10.5` sets it, `target reset` clears it
type = custom/script
exec = target
interval = 2
format-prefix = "󰓾 "
format-prefix-font = 2
format-prefix-foreground = ${theme.urgent}

[module/colorpick]
type = custom/text
format = 󰈊
format-font = 2
format-foreground = ${theme.accent}
click-left = ~/.local/bin/colorpick

[module/bluetooth]
type = custom/script
exec = bt-status
interval = 3
format-font = 3
click-left = bartui bluetooth
click-right = bt-status toggle

[module/battery]
type = internal/battery
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
full-at = 99
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-font = 2
ramp-capacity-foreground = ${theme.accent}
animation-charging-0 = 󰢜
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂅
animation-charging-font = 2
animation-charging-foreground = ${theme.accent}
animation-charging-framerate = 750

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "󰍛 "
format-prefix-font = 2
format-prefix-foreground = ${theme.accent}
label = %{A1:bartui top:}%percentage%%%{A}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰘚 "
format-prefix-font = 2
format-prefix-foreground = ${theme.accent}
label = %{A1:bartui top:}%used%%{A}

[module/volume]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 3
ramp-volume-foreground = ${theme.accent}
format-muted = <label-muted>
format-muted-prefix = "󰝟 "
format-muted-prefix-font = 3
format-muted-prefix-foreground = ${theme.dim}
label-muted = muted
label-muted-foreground = ${theme.dim}
click-left = bartui audio
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-middle = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/updates]
; Guix updates (count written by ~/.local/bin/guix-updates-check); click: pull + upgrade
type = custom/script
exec = cat $HOME/.cache/Updates.txt 2>/dev/null || echo 0
interval = 600
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = #578a29
click-left = xterm -class FloaTerm -e $HOME/.local/bin/guix-updates-run &

[module/date]
; e.g. "Sun, 11 Oct 2026  7:40pm"   left-click: 3-month calendar, right-click: time only / full
type = custom/script
interval = 1
exec = $HOME/.local/bin/clock-fmt
click-left = bartui calendar &
click-right = $HOME/.local/bin/clock-fmt toggle

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 63%
tray-background = ${theme.bg}

[module/power]
type = custom/text
format = ⏻
format-font = 2
format-foreground = ${theme.accent}
click-left = power-menu
