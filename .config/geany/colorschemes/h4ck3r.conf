# h4ck3r for Geany: colours follow the active rice (rice set NAME rewrites them).
# Selected in geany.conf (color_scheme=h4ck3r.conf). Restart Geany after a switch.
[theme_info]
name=h4ck3r
description=Follows the active rice (~/.config/rices); same roles as nvim colors/h4ck3r.lua
version=1.0
author=sys7mfaul7
url=
compat=1.22;1.23;1.24;1.25;1.26;1.27;1.28;1.29;1.30;1.31;1.32;1.33;1.34;1.35;1.36;1.37;1.38

[named_colors]
bg=#000000
bg2=#0f1a14
sel=#1f6f2f
dim=#2f5a2f
cmt=#4f7f5a
mid=#5fbf5f
fg=#c0ffc0
hi=#00ff41
br=#8fef8f
red=#ff5f5f
amb=#e6db74

[named_styles]
default=fg;bg;false;false
error=red;bg;true;false
op=fg;bg
sel=fg;sel;true;true
current_line=;bg2;true
brace_good=hi;bg2;true
brace_bad=red;bg;true
margin_line_number=dim;bg
margin_folding=dim;bg
fold_symbol_highlight=hi
indent_guide=dim
caret=hi;;false
marker_line=fg;bg2
marker_search=bg;mid
marker_mark=fg;sel
call_tips=fg;bg2
white_space=dim;;true
comment=cmt;;false;true
comment_doc=cmt;;false;true
comment_line=cmt;;false;true
comment_line_doc=cmt;;false;true
comment_doc_keyword=mid;;true;true
comment_doc_keyword_error=red;;false;true
number=br
number_1=br
number_2=br
type=br;;true
class=br;;true
function=hi
parameter=fg
keyword=hi;;true
keyword_1=hi;;true
keyword_2=br;;true
keyword_3=mid
keyword_4=mid
identifier=fg
identifier_1=fg
identifier_2=br
identifier_3=fg
identifier_4=fg
string=mid
string_1=mid
string_2=mid
string_3=mid
string_4=mid
string_eol=red;bg2
character=br
backtick=mid
here_doc=mid
label=br;;true
preprocessor=mid
regex=amb
operator=fg
decorator=mid
other=br
tag=hi
tag_unknown=red
tag_end=hi
attribute=br
attribute_unknown=red
value=mid
entity=br
line_added=hi
line_removed=red
line_changed=amb
